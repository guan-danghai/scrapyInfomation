[web_view]
; 访问阅读统计页 /dispatch-dashboard 与 /api/dispatch/read-report 时 URL 加 ?key= 或请求头 x-dashboard-key
dashboard_secret = 123456
; 摘要包目录（可选）：默认同项目根下 digest_packs。若跑批机与 Node 不在同一台，请同步目录或填绝对路径；也可设环境变量 DIGEST_PACK_DIR
;digest_pack_dir = E:/data/digest_packs
