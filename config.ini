[scraper]
; 登录账号
username = 18515512357
password = czw123456

; 关键词列表，英文逗号隔开，程序依次逐个爬取，，，银行,
keywords = 银行,资产管理,信托,消费金融,汽车金融,农村信用,金融租赁,金融控股,财务公司,理财

; 每个关键词最多爬几页搜索结果
max_pages = 100

; 是否无头模式（true=不弹浏览器窗口, false=弹出窗口方便调试）
headless = true

; 输出目录（每个关键词会在此目录下建子目录）
output_dir = output

; 保存格式：txt=仅文本, html=仅HTML, json=仅JSON（结构化，含表格）, both=同时保存 txt 和 json
output_format = json

; 搜索模式：0=全文搜索（默认），1=精准搜索
search_mode = 0

; 时间筛选范围：today=当天；yesterday 或 t-1=昨天；或写具体日期如 2026-03-13；留空则不筛选
; 定时任务「每天清晨跑 T-1」请用 run_pipeline_morning_tminus1.bat 或：python run_pipeline.py --t-minus-1（会覆盖此处日期）
start_date =  2026-03-30
end_date =  2026-03-30

; 每步操作间隔毫秒（越大越慢越安全，建议 300~800）
slow_mo = 400

; 是否对详情页「公告正文」内嵌图片做 OCR（true=开启；false=关闭，避免错字/侧栏混入导致正文混乱）。附件 PDF、弹窗查看器 OCR 不受此项影响。
article_inline_image_ocr = false

; 标题排除词，英文逗号隔开，标题中含任意一词则跳过该条，不进入详情页
exclude_keywords = 货物,监理供应商,厨房,债权处置,租用,绿植,品牌,餐饮，装饰,宣传,用车,招租,物资供应,生日祝福,食材,停车位,广告,后勤与保障,物业管理,物业服务,保洁服务,绿化养护,食堂承包,食材供应,车辆租赁,维修,办公,印刷品,宣传品,礼品,服装,安防工程,监控设备,消防,消防工程,基建工程,电梯,空调,发电机,柜员机,ATM,清分机,点钞机,现金清分,现金押运,档案数字化,档案扫描,呼叫中心,客服外包,催收,不良资产,审计,评估,法律咨询,保险代理,基金代销,理财销售,机房运维,视频会议,培训,团建,会议服务,押运,物料,驾驶员,续租,装修,食堂,客户活动,（施工）,(施工)

