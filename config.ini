to_chatid = 

; 汇总页推送（build_summary_page.py 生成汇总页后，发一条「文本卡片」到企业微信）
; summary_page_url：汇总页完整可访问地址（若配置则优先使用）
; summary_base_url：汇总页所在根 URL，脚本会用 根URL/关键词/汇总_关键词.html 作为链接
; 例如将  output/银行/汇总_银行.html 部署到 https://xxx.com/output/ 下，则填 summary_base_url = https://xxx.com/output
;summary_page_url =
;summary_base_url =

; 招采信息披露页推送（公众号式文本卡片）。运行 push_disclose_to_wecom.py 会发送一条卡片，点击跳转该 URL
; HTTP 示例（Nginx 反代端口按实际填写，如 8335；直连 Node 可写 http://域名:5000/）
; 若以后上正式 HTTPS，再改为 https://域名/ 并部署受信任证书
; 卡片实际链接为 disclose_page_url + /digest/<token>（token 与项目根 digest_packs/<token>/ 对应）
; 验证期：base 用 /ztb-test（Node 5001）；上生产后改为 /ztb（Node 5000）并把下方 test_mode 改为 false
disclose_page_url = http://ztb.resoftcss.com.cn:8335/ztb

[environment]
; true：send_digest_wecom 发送前强制用 disclose_page_url 拼摘要链接，忽略 digest_pending_send.json 里旧的 /ztb 生产路径（仅验证测试环境时请保持 true）
test_mode = true

; ---------- AI 分析 + 入库（ingest_bank_to_db.py）----------
[database]
; 数据库类型：mysql
driver = mysql
; 主机、端口、库名、用户名、密码
host = 127.0.0.1
port = 2309
; 测试环境目录0427中曾为 scraping_infos_test；与本机不一致时请改为实际库名。
; 同步测试库同款表结构：python tools/apply_dispatch_schema.py（或手工执行 docs/dispatch_routing_schema.sql）


[ai]

[dispatch]
; 自动分发规则（send_digest_wecom.py auto_route=true 使用）
; 售前路由主数据源：crm_lead（旧）| sales_lead_confirm（Excel 导入 tools/import_sales_lead_confirm_xlsx.py）
presale_route_source = sales_lead_confirm
; 采购人 -> customer_alias_map 归并客户 -> crm_lead / sales_lead_confirm 查售前（多人用 | 分隔）
alias_table = customer_alias_map
lead_table = crm_lead
alias_pattern_col = alias_pattern
alias_customer_col = canonical_customer
alias_type_col = match_type
alias_priority_col = priority
alias_enabled_col = enabled
lead_customer_col = customer_name
; @售前 展示与路由：线索表里售前人员姓名/账号列表所在列（一般为 sales）
lead_presale_names_col = sales
; 若另有单独存企业微信 userid 的列可写上列名；仅用 sales 解析姓名时请填 - 避免误读旧的 presale_userids
lead_presale_userids_col = -
; 多行线索时按此列从新到旧选「第一条匹配且售前非空」；留空则若表有 register_date 优先按登记日期，否则 updated_at/created_at
;lead_time_order_col = register_date
lead_enabled_col = enabled
; 匹配售前时排除的业务条线（crm_lead.business_line 等于下列值的整行不参与）；逗号分隔；- 或 NONE 表示不排除
lead_business_line_col = business_line
lead_exclude_business_lines = 售后维护条线
org_user_table = org_user
org_user_name_col = user_name
org_user_account_col = user_account
org_user_deleted_col = is_deleted
; sales_lead_confirm 表（与 Excel 列名对应，一般不改）
sales_confirm_table = sales_lead_confirm
sales_confirm_customer_col = customer_name
sales_confirm_sales_col = sales
sales_confirm_uid_col = -
sales_confirm_enabled_col = enabled
; sales_lead_confirm 是否启用子串/池解析等模糊售前匹配（true 易把「表外采购人」绑到错误行；false=仅全文 TRIM 或归一化完全一致）
sales_confirm_fuzzy_match = false
; 关键词 → 固定 @ 售前 userid（跳过 CRM 匹配），格式：关键词=userid1|userid2，多项英文逗号分隔
keyword_presale_userids = 金融委员会办公室=lixiguo|duanwangdong
; 售前路由是否调用大模型匹配客户/机构（false=仅用规则+别名表，大批量更快）
enable_ai_customer_match = false
; 调试：环境变量 DISPATCH_AI_VERBOSE=1 仅打印售前 AI 发送/返回；或与 DISPATCH_PERSIST_VERBOSE=1（refresh_digest_manifest -v）一并打印
; 自动分发群发（stdin JSON 设 auto_route=true）且未传 routing_skip_ai 时：是否默认跳过 AI（true=与 stdin routing_skip_ai=true 等效）
routing_skip_ai = false

[digest]
; materialize_digest_pack 生成 manifest 后是否跳过写入 digest_item_presale_route（true=跳过；可再配合工具 rebuild_digest_item_routes 补写）。环境变量 DIGEST_SKIP_PERSIST_ROUTES 优先于本项
skip_persist_routes = false

#E:\caizhaowang_full\caizhaowang\web-view-node> npm start
