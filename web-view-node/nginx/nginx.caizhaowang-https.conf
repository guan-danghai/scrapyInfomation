# HTTPS 443 + HTTP 80 跳转（反代 Node 127.0.0.1:5000）
# 证书放在 nginx 安装目录下：conf/ssl/fullchain.pem 与 conf/ssl/privkey.pem
# （运行 gen-dev-ssl.ps1 可生成自签测试证书，或自行拷贝正式证书）
#
# Windows：监听 80/443 通常需「以管理员身份运行」PowerShell/CMD 后再启动 nginx。
# 启动：start-nginx-proxy.cmd -Https
#
# nginx 1.25+：http2 使用独立指令（本机 WinGet 1.29 适用）

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost ztb.resoftcss.com.cn;
        return 301 https://$host$request_uri;
    }

    server {
        listen              443 ssl;
        http2               on;
        server_name         localhost ztb.resoftcss.com.cn;

        # 相对路径以 conf/ 为基准（与配置文件同目录下的 ssl 子目录）
        ssl_certificate     ssl/fullchain.pem;
        ssl_certificate_key ssl/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        client_max_body_size 8m;

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
