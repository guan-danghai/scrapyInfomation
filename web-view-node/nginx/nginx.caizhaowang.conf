# 本机 Windows：用 Nginx 反代到 Node（127.0.0.1:5000）
# 使用方式：在 nginx 安装目录下执行
#   nginx.exe -p . -c conf/nginx.caizhaowang.conf
# 或运行同目录下的 start-nginx-proxy.ps1（会自动找安装路径）
#
# 默认监听 8335（无需管理员）；若要 443/80，请改下方 listen 并以管理员运行 nginx。

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8335;
        server_name  localhost;

       #  location / {
       #      proxy_pass http://127.0.0.1:5000;
       #      proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_connect_timeout 60s;
        #     proxy_send_timeout 60s;
        #     proxy_read_timeout 60s;
       #  }


	# 视频播放h5页面
	location /presales/wecom/ {
          try_files $uri $uri/ /presales/wecom/index.html;
	  # 静态资源缓存
          location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
              expires 7d;
              add_header Cache-Control "public, immutable";
          }

          # HTML 不缓存
          location ~* \.html$ {
              expires -1;
              add_header Cache-Control "no-cache, no-store, must-revalidate";
          }
	}

	location /presales/parts/ {
	  internal;
	  alias E:/presales/web/videoParts/report-video;
	  expires 7d;
          add_header Cache-Control "public, max-age=604800";

          # 禁止直接访问上级目录
          if ($request_filename ~* \.\./) {
              return 403;
          }
	}

	
	location /presales/api/ {
	  proxy_pass http://127.0.0.1:7000/;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto $scheme;

	  # 超时配置
	  proxy_connect_timeout 60s;
	  proxy_send_timeout 60s;
	  proxy_read_timeout 60s;
	}
    }

    

}
